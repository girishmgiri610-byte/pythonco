
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>🎓 Student MS</h2>
    <p class="menu-title">MAIN MENU</p>
    <a href="#dashboard">Dashboard</a>
    <a href="#students">Students</a>
    <a href="#add-student">Add Student</a>
</div>

<div class="main">

    <header>
        <div>
            <h1>Student Management System</h1>
            <p>Manage student records easily</p>
        </div>
        <button onclick="showForm()">+ Add Student</button>
    </header>

    <section class="stats" id="dashboard">
        <div class="stat-card">
            <h3>Total Students</h3>
            <h2 id="totalStudents">0</h2>
        </div>
        <div class="stat-card">
            <h3>Male Students</h3>
            <h2 id="maleStudents">0</h2>
        </div>
        <div class="stat-card">
            <h3>Female Students</h3>
            <h2 id="femaleStudents">0</h2>
        </div>
    </section>

    <section class="form-section" id="add-student">
        <h2 id="formTitle">Add New Student</h2>

        <form id="studentForm">
            <input type="hidden" id="editId">

            <div class="form-grid">
                <input type="text" id="name"
                    placeholder="Student Name" required>

                <input type="text" id="usn"
                    placeholder="USN / Student ID" required>

                <input type="email" id="email"
                    placeholder="Email Address" required>

                <input type="tel" id="phone"
                    placeholder="Phone Number" required
                    pattern="[0-9]{10}" maxlength="10">

                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Science">Information Science</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Civil">Civil</option>
                </select>

                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">
                Add Student
            </button>
            <button type="button" class="cancel-btn"
                onclick="resetForm()">Cancel</button>
        </form>
    </section>

    <section class="table-section" id="students">
        <h2>Student Records</h2>

        <input type="text" id="search"
            placeholder="Search by name or USN...">

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>USN</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Gender</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>
        <p id="emptyMessage">No student records found.</p>
    </section>

</div>

<script src="java.js"></script>
</body>
</html>
